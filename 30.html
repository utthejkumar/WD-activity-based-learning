<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus & Train Ticket Booking Interface</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8f9fa; color: #333; padding: 20px; }

        .container { max-width: 900px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #2c3e50; text-align: center; }

    
        .search-card { background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; }
        .search-btn { background: #e67e22; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; padding: 10px; transition: background 0.2s; grid-column: span 1; align-self: flex-end; }
        .search-btn:hover { background: #d35400; }

        .booking-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .booking-layout { grid-template-columns: 1fr; } }

        .card { background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h3 { margin-bottom: 15px; font-size: 16px; border-bottom: 2px solid #f1f2f6; padding-bottom: 8px; }

        /* Seat Matrix using Checkboxes */
        .seat-grid { display: grid; grid-template-columns: repeat(4, 40px); gap: 10px; justify-content: center; margin: 20px 0; }
        .seat-item { display: none; }
        .seat-label { display: flex; align-items: center; justify-content: center; height: 40px; background: #dfe6e9; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; user-select: none; }
        .seat-item:checked + .seat-label { background: #27ae60; color: white; }
        .seat-item:disabled + .seat-label { background: #b2bec3; color: #636e72; cursor: not-allowed; opacity: 0.6; }

        .legend { display: flex; justify-content: center; gap: 15px; font-size: 12px; margin-bottom: 15px; }
        .legend span { display: flex; align-items: center; gap: 5px; }
        .legend-box { width: 12px; height: 12px; border-radius: 2px; }

        /* Fare Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #dee2e6; }
        th { background: #f1f2f6; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Express Travel Booking</h1>

   
        <div class="search-card">
            <div class="form-group">
                <label>From</label>
                <input type="text" value="City A - Central Station">
            </div>
            <div class="form-group">
                <label>To</label>
                <input type="text" value="City B - Metro Terminal">
            </div>
            <div class="form-group">
                <label>Travel Date</label>
                <input type="date" value="2026-11-15">
            </div>
            <button class="search-btn">Modify Search</button>
        </div>

        <div class="booking-layout">

            <div class="card">
                <h3>Available Services & Fares</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Service Type</th>
                            <th>Departure</th>
                            <th>Duration</th>
                            <th>Fare</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Superfast Express (Train)</td>
                            <td>08:30 AM</td>
                            <td>3h 45m</td>
                            <td>$45.00</td>
                        </tr>
                        <tr>
                            <td>Luxury AC Volvo (Bus)</td>
                            <td>10:15 AM</td>
                            <td>4h 30m</td>
                            <td>$30.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>


            <div class="card">
                <h3>Select Seats</h3>
                <div class="legend">
                    <span><div class="legend-box" style="background:#dfe6e9;"></div> Available</span>
                    <span><div class="legend-box" style="background:#27ae60;"></div> Selected</span>
                    <span><div class="legend-box" style="background:#b2bec3;"></div> Booked</span>
                </div>

                <div class="seat-grid">
                    <!-- Row 1 -->
                    <input type="checkbox" id="s1" class="seat-item"><label for="s1" class="seat-label">1A</label>
                    <input type="checkbox" id="s2" class="seat-item"><label for="s2" class="seat-label">1B</label>
                    <input type="checkbox" id="s3" class="seat-item" disabled><label for="s3" class="seat-label">1C</label>
                    <input type="checkbox" id="s4" class="seat-item"><label for="s4" class="seat-label">1D</label>

                    <!-- Row 2 -->
                    <input type="checkbox" id="s5" class="seat-item"><label for="s5" class="seat-label">2A</label>
                    <input type="checkbox" id="s6" class="seat-item" disabled><label for="s6" class="seat-label">2B</label>
                    <input type="checkbox" id="s7" class="seat-item"><label for="s7" class="seat-label">2C</label>
                    <input type="checkbox" id="s8" class="seat-item"><label for="s8" class="seat-label">2D</label>
                </div>

                <button style="width:100%; padding:10px; background:#2ecc71; color:white; border:none; font-weight:bold; border-radius:4px; cursor:pointer; margin-top:15px;">Confirm Seats</button>
            </div>
        </div>
    </div>

</body>
</html>
